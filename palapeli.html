<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Palapeli</title>
<link rel="stylesheet" href="css/style.css">

<style>
    body {
        touch-action: manipulation;
        overscroll-behavior: none;
    }

    #puzzle-container {
        width: 300px;
        height: 300px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: 4px;
        margin-bottom: 30px;
    }

    .slot {
        width: 100px;
        height: 100px;
        border: 2px dashed #999;
    }

    #pieces {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-top: 20px;
    }

    .piece {
        width: 100px;
        height: 100px;
        background-size: 300px 300px;
        border: 2px solid #333;
        cursor: grab;
    }

    @media (max-width: 400px) {
        #puzzle-container {
            width: 240px;
            height: 240px;
        }
        .slot, .piece {
            width: 80px;
            height: 80px;
            background-size: 240px 240px;
        }
    }
</style>
</head>

<body ontouchmove="event.preventDefault()">

<h1>Palapeli</h1>

<div id="puzzle-container">
    <div class="slot" id="slot-1"></div>
    <div class="slot" id="slot-2"></div>
    <div class="slot" id="slot-3"></div>
    <div class="slot" id="slot-4"></div>
    <div class="slot" id="slot-5"></div>
    <div class="slot" id="slot-6"></div>
    <div class="slot" id="slot-7"></div>
    <div class="slot" id="slot-8"></div>
    <div class="slot" id="slot-9"></div>
</div>

<div id="pieces"></div>

<div id="done" style="display:none;">
    <h2>Tehtävä suoritettu!</h2>
    <button class="btn" onclick="completeTask()">Jatka</button>
</div>

<script>
document.addEventListener("touchstart", function(){}, true);

const imageURL = "images/palapeli.jpg";

const piecesContainer = document.getElementById("pieces");

let pieces = [];
for (let i = 1; i <= 9; i++) {
    const piece = document.createElement("div");
    piece.classList.add("piece");
    piece.id = "piece-" + i;

    const x = ((i - 1) % 3) * -100;
    const y = Math.floor((i - 1) / 3) * -100;

    piece.style.backgroundImage = `url(${imageURL})`;
    piece.style.backgroundPosition = `${x}px ${y}px`;

    piece.draggable = true;
    piece.addEventListener("dragstart", dragStart);

    pieces.push(piece);
}

pieces.sort(() => Math.random() - 0.5);
pieces.forEach(p => piecesContainer.appendChild(p));

function dragStart(e) {
    e.dataTransfer.setData("text/plain", e.target.id);
}

const slots = document.querySelectorAll(".slot");
slots.forEach(slot => {
    slot.addEventListener("dragover", e => e.preventDefault());
    slot.addEventListener("drop", dropPiece);
});

function dropPiece(e) {
    const pieceId = e.dataTransfer.getData("text/plain");
    const piece = document.getElementById(pieceId);

    if (e.target.children.length > 0) return;

    e.target.appendChild(piece);

    checkCompletion();
}

function checkCompletion() {
    let correct = 0;

    for (let i = 1; i <= 9; i++) {
        const slot = document.getElementById("slot-" + i);
        if (slot.children.length === 1 && slot.children[0].id === "piece-" + i) {
            correct++;
        }
    }

    if (correct === 9) {
        document.getElementById("done").style.display = "block";
    }
}

function completeTask() {
    let score = Number(localStorage.getItem("score") || 0);
    localStorage.setItem("score", score + 1);
    window.location.href = "index.html";
}
</script>

</body>
</html>
